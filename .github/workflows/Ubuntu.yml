name: Ubuntu Workflow

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    # Cache Swift build artifacts and dependencies
    - name: Cache Swift dependencies
      uses: actions/cache@v4.2.0
      with:
        path: |
          ~/.swiftpm
          .build
          certi/.build
        key: ${{ runner.os }}-swift-${{ hashFiles('**/Package.swift') }}
        restore-keys: |
          ${{ runner.os }}-swift-

    # Build main project
    - name: Build main project
      run: swift build -v

    # Build certi subproject
    - name: Build certi project
      working-directory: certi
      run: swift build -v