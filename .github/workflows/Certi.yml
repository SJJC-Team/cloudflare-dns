name: Certi Workflow

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    # Cache Swift dependencies for certi project
    - name: Cache Swift dependencies (certi)
      uses: actions/cache@v4.2.0
      with:
        path: |
          ~/.swiftpm
          certi/.build
        key: ${{ runner.os }}-swift-certi-${{ hashFiles('certi/Package.swift') }}
        restore-keys: |
          ${{ runner.os }}-swift-certi-

    # Build the certi project
    - name: Build certi project
      working-directory: certi
      run: swift build -v